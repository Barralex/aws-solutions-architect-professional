<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS SAP — Exam Practice Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>document.write('<script src="data.js?v=' + Date.now() + '"><\/script>');</script>
<style>
  :root {
    --color-primary:#1E40AF; --color-secondary:#3B82F6; --color-accent:#D97706;
    --color-success:#15803D; --color-destructive:#DC2626;
    --color-bg:#0B1220; --color-bg-elevated:#111B2E; --color-surface:#18243C;
    --color-surface-hover:#1F2D49; --color-border:#243553; --color-border-strong:#2F4670;
    --color-fg:#E6ECF7; --color-fg-muted:#94A3B8; --color-fg-subtle:#64748B;
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px;
    --r-sm:6px; --r-md:10px; --r-lg:14px;
    --fs-xs:11px; --fs-sm:12px; --fs-base:13px; --fs-md:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:28px;
    --t-fast:150ms; --ease:cubic-bezier(0.4,0,0.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Fira Sans',sans-serif;background:var(--color-bg);color:var(--color-fg);min-height:100vh;padding:var(--s-6);font-size:var(--fs-base);line-height:1.5}
  .num,td,th{font-variant-numeric:tabular-nums}
  .mono{font-family:'Fira Code',monospace}
  a{color:var(--color-secondary);text-decoration:none}
  a:hover{text-decoration:underline}

  /* Top bar */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:var(--s-5);margin-bottom:var(--s-6);border-bottom:1px solid var(--color-border);gap:var(--s-4);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:var(--s-3);cursor:pointer}
  .brand-mark{width:38px;height:38px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--color-primary),var(--color-secondary));display:grid;place-items:center;color:#fff}
  .brand-text h1{font-size:var(--fs-lg);font-weight:600;line-height:1.2}
  .brand-text p{color:var(--color-fg-muted);font-size:var(--fs-sm)}
  .meta{color:var(--color-fg-muted);font-size:var(--fs-sm);font-family:'Fira Code',monospace}

  /* Breadcrumb */
  .crumbs{display:flex;align-items:center;gap:var(--s-2);margin-bottom:var(--s-5);font-size:var(--fs-sm);color:var(--color-fg-muted);font-family:'Fira Code',monospace}
  .crumbs span.sep{color:var(--color-fg-subtle)}
  .crumbs a{color:var(--color-secondary)}
  .crumbs .current{color:var(--color-fg)}

  /* KPI strip */
  .kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s-3);margin-bottom:var(--s-6)}
  .kpi{background:var(--color-bg-elevated);border:1px solid var(--color-border);border-radius:var(--r-md);padding:var(--s-4) var(--s-5)}
  .kpi-label{display:flex;align-items:center;gap:var(--s-2);color:var(--color-fg-muted);font-size:var(--fs-xs);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
  .kpi-value{font-family:'Fira Code',monospace;font-size:var(--fs-2xl);font-weight:600;line-height:1.1;margin-top:var(--s-1)}
  .kpi-sub{font-size:var(--fs-xs);color:var(--color-fg-subtle);margin-top:var(--s-1)}
  .kpi.success .kpi-value{color:#4ADE80}
  .kpi.accent .kpi-value{color:var(--color-accent)}
  .kpi.primary .kpi-value{color:var(--color-secondary)}
  .kpi.danger .kpi-value{color:#F87171}

  /* Panels */
  .panel{background:var(--color-bg-elevated);border:1px solid var(--color-border);border-radius:var(--r-lg);padding:var(--s-6);margin-bottom:var(--s-6)}
  .panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s-5);gap:var(--s-3);flex-wrap:wrap}
  .panel-title{font-size:var(--fs-md);font-weight:600}
  .panel-subtitle{color:var(--color-fg-muted);font-size:var(--fs-sm)}
  .chart-wrap{position:relative;height:280px}

  /* Exam grid */
  .exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--s-3)}
  .exam-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-md);padding:var(--s-4);cursor:pointer;transition:all var(--t-fast) var(--ease);display:block;color:inherit;text-decoration:none}
  .exam-card:hover{border-color:var(--color-border-strong);background:var(--color-surface-hover);transform:translateY(-2px)}
  .exam-card.pending{opacity:.55;cursor:not-allowed}
  .exam-card.pending:hover{transform:none;border-color:var(--color-border)}
  .exam-card .ec-name{font-family:'Fira Code',monospace;font-size:var(--fs-sm);color:var(--color-fg-muted);margin-bottom:var(--s-2)}
  .exam-card .ec-score{font-family:'Fira Code',monospace;font-size:var(--fs-xl);font-weight:700;color:var(--color-accent)}
  .exam-card.pending .ec-score{color:var(--color-fg-subtle)}
  .exam-card .ec-meta{display:flex;justify-content:space-between;align-items:center;margin-top:var(--s-3);font-size:var(--fs-xs);color:var(--color-fg-muted);font-family:'Fira Code',monospace}

  /* Pattern cards (compact) */
  .patterns-list{display:flex;flex-direction:column;gap:var(--s-2)}
  .pattern-row{display:grid;grid-template-columns:32px 1fr auto auto;gap:var(--s-3);align-items:center;padding:var(--s-3) var(--s-4);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-md);cursor:pointer;transition:all var(--t-fast) var(--ease);color:inherit;text-decoration:none}
  .pattern-row:hover{border-color:var(--color-border-strong);background:var(--color-surface-hover)}
  .pattern-row.severity-3{border-left:3px solid var(--color-destructive)}
  .pattern-row.severity-2{border-left:3px solid var(--color-accent)}
  .pattern-row.severity-1{border-left:3px solid var(--color-secondary)}
  .pattern-row .rank{font-family:'Fira Code',monospace;font-size:var(--fs-lg);font-weight:700;color:var(--color-fg-subtle)}
  .pattern-row .pr-topic{font-size:var(--fs-md);font-weight:600}
  .pattern-row .pr-area{font-size:var(--fs-xs);color:var(--color-secondary);font-family:'Fira Code',monospace;margin-top:2px}
  .pattern-row .pr-occ{font-family:'Fira Code',monospace;font-size:var(--fs-lg);font-weight:700;color:var(--color-accent)}
  .pattern-row .pr-arrow{color:var(--color-fg-subtle);font-family:'Fira Code',monospace}

  /* Tables */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:var(--s-2) var(--s-3);border-bottom:1px solid var(--color-border);color:var(--color-fg-muted);font-size:var(--fs-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  td{padding:var(--s-3);border-bottom:1px solid var(--color-border);font-size:var(--fs-base);vertical-align:top}
  tbody tr{transition:background-color var(--t-fast) var(--ease)}
  tbody tr:hover{background:var(--color-surface-hover)}

  /* Badges */
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:600;font-family:'Fira Code',monospace;border:1px solid transparent}
  .badge.ok{background:rgba(21,128,61,.12);color:#4ADE80;border-color:rgba(74,222,128,.25)}
  .badge.fail{background:rgba(220,38,38,.10);color:#F87171;border-color:rgba(248,113,113,.25)}
  .badge.partial{background:rgba(217,119,6,.12);color:var(--color-accent);border-color:rgba(217,119,6,.30)}
  .badge.pending{background:rgba(148,163,184,.10);color:var(--color-fg-muted);border-color:var(--color-border)}

  /* Insights */
  .insight{font-size:var(--fs-sm);border-left:2px solid var(--color-accent);padding-left:var(--s-3);margin-top:var(--s-2);line-height:1.55}
  .insight b{color:var(--color-accent);font-weight:500}
  .pattern-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:var(--s-2)}
  .pattern-tag{font-size:var(--fs-xs);padding:2px 8px;border-radius:var(--r-sm);background:var(--color-surface);color:var(--color-fg-muted);border:1px solid var(--color-border);font-family:'Fira Code',monospace;cursor:pointer}
  .pattern-tag:hover{background:var(--color-surface-hover);color:var(--color-fg)}

  .empty{color:var(--color-fg-subtle);font-size:var(--fs-sm);padding:var(--s-4);text-align:center}
  .hidden{display:none}

  /* Attack groups (exam detail) */
  .attack-group{background:var(--color-surface);border:1px solid var(--color-border);border-left:3px solid var(--color-destructive);border-radius:var(--r-md);padding:var(--s-4) var(--s-5);margin-bottom:var(--s-4)}
  .ag-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding-bottom:var(--s-2);border-bottom:1px solid var(--color-border);transition:opacity var(--t-fast) var(--ease)}
  .ag-head:hover{opacity:.85}
  .attack-group.collapsed .ag-head{border-bottom:0;padding-bottom:0}
  .attack-group.collapsed .ag-body{display:none}
  .ag-body{margin-top:var(--s-3)}
  .ag-title-wrap{display:flex;align-items:center;gap:var(--s-2)}
  .ag-toggle{font-family:'Fira Code',monospace;font-size:var(--fs-md);color:var(--color-fg-muted);width:16px;display:inline-block;transition:transform var(--t-fast) var(--ease)}
  .attack-group.collapsed .ag-toggle{transform:rotate(-90deg)}
  .ag-title{font-size:var(--fs-lg);font-weight:700;color:#F87171}
  .ag-count{font-family:'Fira Code',monospace;font-size:var(--fs-xs);color:var(--color-fg-muted);text-transform:uppercase;letter-spacing:.06em}
  .ag-rules{display:flex;flex-direction:column;gap:var(--s-2);margin-bottom:var(--s-4)}
  .ag-rule{display:block;padding:var(--s-3);background:var(--color-bg-elevated);border:1px solid var(--color-border);border-radius:var(--r-sm);color:inherit;text-decoration:none;transition:all var(--t-fast) var(--ease)}
  .ag-rule:hover{border-color:var(--color-accent);background:var(--color-surface-hover);text-decoration:none}
  .ag-rule-topic{font-size:var(--fs-md);font-weight:600;color:var(--color-accent);margin-bottom:var(--s-1)}
  .ag-rule-note{font-size:var(--fs-sm);color:var(--color-fg);line-height:1.55}
  .ag-questions{display:flex;flex-direction:column;gap:var(--s-2)}
  .ag-q{padding:var(--s-3);background:var(--color-bg-elevated);border-radius:var(--r-sm);border:1px solid var(--color-border)}
  .ag-q-head{display:flex;align-items:flex-start;gap:var(--s-2);margin-bottom:var(--s-2)}
  .ag-q-summary{font-size:var(--fs-base);line-height:1.5}
  .ag-q-insight{font-size:var(--fs-sm);color:var(--color-fg-muted);line-height:1.5;padding-left:var(--s-3);border-left:2px solid var(--color-accent);margin-top:var(--s-2)}
  .ag-q-diff{margin-top:var(--s-2);font-size:var(--fs-sm);display:flex;flex-direction:column;gap:2px;font-family:'Fira Code',monospace}
  .diff-label{display:inline-block;width:64px;font-weight:600}
  .diff-bad{color:#F87171}
  .diff-good{color:#4ADE80}
  .back-btn{display:inline-flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-3);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-sm);color:var(--color-fg);cursor:pointer;font-family:'Fira Code',monospace;font-size:var(--fs-sm);margin-bottom:var(--s-4)}
  .back-btn:hover{background:var(--color-surface-hover)}
</style>
</head>
<body>
<header class="topbar">
  <a href="#/" class="brand">
    <div class="brand-mark">☁</div>
    <div class="brand-text">
      <h1>AWS SAP — Exam Practice Tracker</h1>
      <p id="subtitle">Loading…</p>
    </div>
  </a>
  <div class="meta" id="meta-line"></div>
</header>

<div id="app"></div>

<script>
const D = window.examData;
const PASS = D.metadata.passMark;
const $app = document.getElementById('app');

// ---- Helpers ----
const pct = e => (e.scoreCorrect != null && e.scoreTotal) ? Math.round(e.scoreCorrect/e.scoreTotal*100) : null;
const completed = D.exams.filter(e => e.scoreCorrect != null);
const examHasData = e => e.date != null || D.trickyQuestions.some(q => q.examN === e.n);

document.getElementById('subtitle').textContent = `${D.metadata.student} · ${D.metadata.exam}`;
document.getElementById('meta-line').textContent = `Last update: ${D.metadata.lastUpdated} · Pass mark: ${PASS}%`;

// ---- Router ----
function route(){
  const h = location.hash.replace(/^#\/?/, '') || '';
  const [view, id] = h.split('/');
  if (view === 'exam')      renderExam(parseInt(id));
  else if (view === 'pattern') renderPattern(id);
  else                      renderHome();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

// ---- Severity ----
function severity(occ){ return occ >= 3 ? 3 : occ >= 2 ? 2 : 1; }

// ---- HOME ----
function renderHome(){
  const pcts = completed.map(pct);
  const best = pcts.length ? Math.max(...pcts) : null;
  const avg  = pcts.length ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : null;
  const passed = pcts.filter(p => p >= PASS).length;

  // Top 5 weaknesses across all exams
  const top5 = [...D.patterns].sort((a,b)=>b.occurrences-a.occurrences).slice(0,5);

  $app.innerHTML = `
    <section class="kpi-strip">
      <div class="kpi success"><div class="kpi-label">🏆 Best</div><div class="kpi-value">${best!=null?best+'%':'—'}</div><div class="kpi-sub">${best!=null?D.exams[pcts.indexOf(best)].name:'No data'}</div></div>
      <div class="kpi accent"><div class="kpi-label">🎯 Average</div><div class="kpi-value">${avg!=null?avg+'%':'—'}</div><div class="kpi-sub">${completed.length} exam(s)</div></div>
      <div class="kpi primary"><div class="kpi-label">⚡ Latest</div><div class="kpi-value">${pcts.length?pcts.at(-1)+'%':'—'}</div><div class="kpi-sub">${pcts.length?completed.at(-1).name:'—'}</div></div>
      <div class="kpi success"><div class="kpi-label">✓ Passed (≥${PASS}%)</div><div class="kpi-value">${passed}</div><div class="kpi-sub">of ${completed.length}</div></div>
      <div class="kpi primary"><div class="kpi-label">⚑ Progress</div><div class="kpi-value">${completed.length}/${D.metadata.totalExams}</div><div class="kpi-sub">exams done</div></div>
    </section>

    <section class="panel">
      <div class="panel-header"><div><div class="panel-title">📈 Score evolution</div><div class="panel-subtitle">Pass mark dashed at ${PASS}%</div></div></div>
      <div class="chart-wrap"><canvas id="hero-chart"></canvas></div>
    </section>

    <section class="panel">
      <div class="panel-header"><div><div class="panel-title">📚 Exámenes</div><div class="panel-subtitle">Click en cualquiera con datos para ver detalle</div></div></div>
      <div class="exam-grid">
        ${D.exams.map(e => {
          const hasData = examHasData(e);
          const p = pct(e);
          const score = p!=null ? `${p}%` : (hasData ? 'En curso' : 'Pendiente');
          const tag = hasData ? `<a href="#/exam/${e.n}" class="exam-card">` : `<div class="exam-card pending">`;
          const close = hasData ? `</a>` : `</div>`;
          const trickyCount = D.trickyQuestions.filter(q => q.examN === e.n).length;
          return `${tag}
            <div class="ec-name">PE ${e.n} · ${e.name.replace('Practice Exam ','')}</div>
            <div class="ec-score">${score}</div>
            <div class="ec-meta"><span>${e.date||'—'}</span><span>${trickyCount} q</span></div>
          ${close}`;
        }).join('')}
      </div>
    </section>

    <section class="panel">
      <div class="panel-header"><div><div class="panel-title">⚠ Top 5 debilidades</div><div class="panel-subtitle">Patrones recurrentes — click para ver preguntas asociadas</div></div></div>
      <div class="patterns-list">
        ${top5.length ? top5.map((p,i)=>`
          <a href="#/pattern/${p.id}" class="pattern-row severity-${severity(p.occurrences)}">
            <div class="rank">#${i+1}</div>
            <div><div class="pr-topic">${p.topic}</div><div class="pr-area">${p.area}</div></div>
            <div class="pr-occ">${p.occurrences}×</div>
            <div class="pr-arrow">→</div>
          </a>`).join('') : '<div class="empty">Sin patrones aún</div>'}
      </div>
    </section>
  `;
  drawChart();
}

function drawChart(){
  const labels = D.exams.map(e=>'PE'+e.n);
  const data = D.exams.map(e => pct(e));
  Chart.defaults.font.family = "'Fira Sans',sans-serif";
  Chart.defaults.color = '#94A3B8';
  new Chart(document.getElementById('hero-chart'), {
    type:'line',
    data:{labels, datasets:[
      {label:'Score', data, borderColor:'#3B82F6', backgroundColor:'rgba(59,130,246,.12)', tension:.35, fill:true, pointRadius:6, pointHoverRadius:10, pointBackgroundColor:'#D97706', pointBorderColor:'#fff', pointBorderWidth:2, borderWidth:3, spanGaps:false},
      {label:`Pass ${PASS}%`, data:labels.map(()=>PASS), borderColor:'#15803D', borderDash:[6,6], pointRadius:0, fill:false, borderWidth:1.5}
    ]},
    options:{responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}},x:{grid:{display:false}}},plugins:{legend:{labels:{boxWidth:12,color:'#E6ECF7'}}}}
  });
}

// ---- EXAM DETAIL ----
function renderExam(n){
  const e = D.exams.find(x => x.n === n);
  if (!e){ location.hash = '#/'; return; }
  const questions = D.trickyQuestions.filter(q => q.examN === n);
  const p = pct(e);

  const correct = questions.filter(q=>q.result==='correct').length;
  const partial = questions.filter(q=>q.result==='partial').length;
  const wrong   = questions.filter(q=>q.result==='incorrect'||q.result==='wrong').length;

  // Sólo lo que tenés que atacar: incorrectas + parciales
  const toAttack = questions.filter(q => q.result==='incorrect' || q.result==='wrong' || q.result==='partial');
  const ok = questions.filter(q => q.result==='correct');

  // Agrupar por área raíz (antes del "/")
  const rootArea = a => (a||'Otros').split('/')[0].trim();
  const groups = {};
  toAttack.forEach(q => {
    const k = rootArea(q.area);
    (groups[k] = groups[k] || []).push(q);
  });
  // Ordenar grupos por cantidad de errores (más errores arriba)
  const sortedGroups = Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);

  // Reglas mentales únicas por grupo (de los patterns asociados a sus preguntas)
  function rulesFor(qs){
    const ids = new Set();
    qs.forEach(q => (q.patternIds||[]).forEach(id => ids.add(id)));
    return [...ids].map(id => D.patterns.find(p=>p.id===id)).filter(Boolean);
  }

  $app.innerHTML = `
    <div class="crumbs"><a href="#/">Home</a><span class="sep">/</span><span class="current">${e.name}</span></div>
    <a href="javascript:history.back()" class="back-btn">← Volver</a>

    <section class="kpi-strip">
      <div class="kpi accent"><div class="kpi-label">Score</div><div class="kpi-value">${p!=null?p+'%':'—'}</div><div class="kpi-sub">${e.scoreCorrect!=null?e.scoreCorrect+'/'+e.scoreTotal:'En curso'}</div></div>
      <div class="kpi success"><div class="kpi-label">✓ Correctas</div><div class="kpi-value">${correct}</div><div class="kpi-sub">repasadas aquí</div></div>
      <div class="kpi accent"><div class="kpi-label">~ Parciales</div><div class="kpi-value">${partial}</div><div class="kpi-sub">multi-select</div></div>
      <div class="kpi danger"><div class="kpi-label">✗ Erradas</div><div class="kpi-value">${wrong}</div><div class="kpi-sub">a repasar</div></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">🎯 Plan de ataque — qué estudiar primero</div>
          <div class="panel-subtitle">Errores y parciales agrupados por área. Las reglas mentales arriba, las preguntas como referencia.</div>
        </div>
      </div>
      ${sortedGroups.length ? sortedGroups.map(([area, qs]) => {
        const rules = rulesFor(qs);
        const groupKey = `exam${n}:${area}`;
        const isCollapsed = localStorage.getItem('ag:'+groupKey) === '1';
        return `
          <div class="attack-group${isCollapsed?' collapsed':''}" data-group-key="${groupKey}">
            <div class="ag-head" onclick="toggleGroup(this.parentNode)">
              <div class="ag-title-wrap">
                <span class="ag-toggle">▾</span>
                <div class="ag-title">${area}</div>
              </div>
              <div class="ag-count">${qs.length} error${qs.length>1?'es':''}</div>
            </div>

            <div class="ag-body">
              ${rules.length ? `<div class="ag-rules">
                ${rules.map(r => `
                  <a href="#/pattern/${r.id}" class="ag-rule">
                    <div class="ag-rule-topic">${r.topic}</div>
                    ${r.notes?`<div class="ag-rule-note">${r.notes}</div>`:''}
                  </a>
                `).join('')}
              </div>` : ''}

              <div class="ag-questions">
                ${qs.map(q => `
                  <div class="ag-q">
                    <div class="ag-q-head">
                      ${resultBadge(q.result)}
                      <span class="ag-q-summary">${q.summary}</span>
                    </div>
                    ${q.keyInsight ? `<div class="ag-q-insight">${q.keyInsight}</div>` : ''}
                    ${q.myAnswer && q.correctAnswer ? `
                      <div class="ag-q-diff">
                        <div><span class="diff-label diff-bad">tu resp:</span> ${q.myAnswer}</div>
                        <div><span class="diff-label diff-good">correcta:</span> ${q.correctAnswer}</div>
                      </div>
                    ` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('') : '<div class="empty">Sin errores en este examen 🎉</div>'}
    </section>

    ${ok.length ? `
      <section class="panel">
        <div class="panel-header" style="cursor:pointer" onclick="document.getElementById('ok-list').classList.toggle('hidden')">
          <div>
            <div class="panel-title">✓ Pegadas (${ok.length}) — click para ver</div>
            <div class="panel-subtitle">Las que ya tenés bajo control</div>
          </div>
        </div>
        <div id="ok-list" class="hidden">
          ${ok.map(q => `
            <div class="ag-q" style="opacity:.7">
              <div class="ag-q-head">${resultBadge(q.result)}<span class="ag-q-summary">${q.summary}</span></div>
              ${q.keyInsight ? `<div class="ag-q-insight">${q.keyInsight}</div>` : ''}
            </div>
          `).join('')}
        </div>
      </section>
    ` : ''}
  `;
}

// ---- PATTERN DETAIL ----
function renderPattern(id){
  const p = D.patterns.find(x=>x.id===id);
  if (!p){ location.hash='#/'; return; }
  const linked = D.trickyQuestions.filter(q => (q.patternIds||[]).includes(id));

  $app.innerHTML = `
    <div class="crumbs"><a href="#/">Home</a><span class="sep">/</span><span class="current">${p.topic}</span></div>
    <a href="javascript:history.back()" class="back-btn">← Volver</a>

    <section class="panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">${p.topic}</div>
          <div class="panel-subtitle">${p.area} · ${p.occurrences} ocurrencias · last seen ${p.lastSeen}</div>
        </div>
      </div>
      <div style="margin-bottom:var(--s-3)">${p.description}</div>
      ${p.notes?`<div class="insight"><b>Regla.</b> ${p.notes}</div>`:''}
    </section>

    <section class="panel">
      <div class="panel-header"><div><div class="panel-title">Preguntas que dispararon este patrón</div></div></div>
      <table>
        <thead><tr><th style="width:64px">Examen</th><th style="width:160px">Área</th><th>Resumen + insight</th><th style="width:90px">Resultado</th></tr></thead>
        <tbody>
          ${linked.length ? linked.map(q=>`
            <tr>
              <td class="mono">${q.examN?'<a href="#/exam/'+q.examN+'">PE'+q.examN+'</a>':'—'}</td>
              <td>${q.area}</td>
              <td><div>${q.summary}</div>${q.keyInsight?`<div class="insight"><b>Insight.</b> ${q.keyInsight}</div>`:''}</td>
              <td>${resultBadge(q.result)}</td>
            </tr>`).join('') : '<tr><td colspan="4" class="empty">Sin preguntas registradas</td></tr>'}
        </tbody>
      </table>
    </section>
  `;
}

function toggleGroup(el){
  el.classList.toggle('collapsed');
  const key = el.getAttribute('data-group-key');
  if (!key) return;
  if (el.classList.contains('collapsed')) localStorage.setItem('ag:'+key, '1');
  else localStorage.removeItem('ag:'+key);
}

function resultBadge(r){
  if (r==='correct') return '<span class="badge ok">✓ OK</span>';
  if (r==='partial') return '<span class="badge partial">~ PARCIAL</span>';
  if (r==='incorrect'||r==='wrong') return '<span class="badge fail">✗ FAIL</span>';
  return '<span class="badge pending">FLAG</span>';
}

route();
</script>
